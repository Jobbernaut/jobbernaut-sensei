[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "jobbernaut-sensei"
version = "0.3.1"
description = "A spaced-repetition CLI for LeetCode practice problems"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
authors = [
    {name = "Snehashish Reddy Manda", email = "srmanda.cs@gmail.com"},
]
keywords = ["leetcode", "spaced-repetition", "algorithms", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/jobbernaut/jobbernaut-sensei"
Repository = "https://github.com/jobbernaut/jobbernaut-sensei"
BugTracker = "https://github.com/jobbernaut/jobbernaut-sensei/issues"

[project.scripts]
sensei = "sensei:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["sensei", "mark", "new", "lopen", "revisit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["completions/_jobbernaut"]