[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "neetcode-tools"
version = "0.1.0"

[project.scripts]
mark    = "mark:main"
new     = "new:main"
open    = "lopen:main"
revisit = "revisit:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["mark", "new", "lopen", "revisit"]
