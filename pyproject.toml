[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "leetcode-sensei"
version = "0.5.3"
description = "A spaced-repetition CLI for LeetCode practice problems"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
authors = [
    {name = "Snehashish Reddy Manda", email = "srmanda.cs@gmail.com"},
]
keywords = ["leetcode", "spaced-repetition", "algorithms", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/overkill-labs/leetcode-sensei"
Repository = "https://github.com/overkill-labs/leetcode-sensei"
BugTracker = "https://github.com/overkill-labs/leetcode-sensei/issues"
Documentation = "https://github.com/overkill-labs/leetcode-sensei/blob/main/README.md"

[project.scripts]
sensei = "sensei:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["sensei", "hint", "mark", "new", "lopen", "revisit", "utils", "banner"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["completions/_leetcode-sensei"]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
